name: CI/CD Pipeline - Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma generate

      - name: Build Next.js Application
        env:
          DATABASE_URL: "file:./dev.db"
          NEXT_PUBLIC_APP_URL: "https://gunaso.4-193-121-134.sslip.io"
        run: npm run build

  deploy:
    name: Deploy to Ubuntu VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '4.193.121.134' }}
          username: ${{ secrets.SERVER_USER || 'tivrasoft' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            chmod +x /home/tivrasoft/gunaso/deploy.sh
            /home/tivrasoft/gunaso/deploy.sh
